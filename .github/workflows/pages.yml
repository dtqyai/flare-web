name: Build Flare for the web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run test:deploy
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Read pinned Emscripten version
        id: pins
        run: python3 -c 'import sys; sys.path.insert(0, "scripts"); from upstream import load_pins; print("emscripten=" + load_pins()["emscripten"])' >> "$GITHUB_OUTPUT"
      - name: Fetch pinned official sources
        run: python3 scripts/fetch.py
      - name: Install Emscripten
        env:
          EMSCRIPTEN_VERSION: ${{ steps.pins.outputs.emscripten }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git work/emsdk
          work/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          work/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Compile game and assemble site
        run: |
          source work/emsdk/emsdk_env.sh
          python3 scripts/build.py
      - name: Check Workers asset limits
        run: python3 scripts/check_assets.py
      - name: Install browser for game regressions
        run: npx playwright install --with-deps chromium
      - name: Verify actual WASM startup and browser saves
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          retention-days: 3
