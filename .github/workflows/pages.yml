name: Build Flare for the web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Read pinned Emscripten version
        id: pins
        run: python3 -c 'import sys; sys.path.insert(0, "scripts"); from upstream import load_pins; print("emscripten=" + load_pins()["emscripten"])' >> "$GITHUB_OUTPUT"
      - name: Fetch pinned official sources
        run: python3 scripts/fetch.py
      - name: Install Emscripten
        env:
          EMSCRIPTEN_VERSION: ${{ steps.pins.outputs.emscripten }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git work/emsdk
          work/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          work/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Compile game and assemble site
        run: |
          source work/emsdk/emsdk_env.sh
          python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
